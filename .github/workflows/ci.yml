name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RamRPG
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # RamRPG resolves dev.willram:ramcore-api|-protocol|-test:2.0.0 from mavenLocal(). CI has no
      # such artifacts, so build them from the RamCore repo into the runner's local Maven repo.
      # (This is the self-contained alternative to publishing RamCore to JitPack; see decision G2.)
      - name: Check out RamCore
        uses: actions/checkout@v4
        with:
          repository: willramanand/RamCore
          path: RamCore

      - name: Publish RamCore to mavenLocal
        working-directory: RamCore
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Test RamRPG
        run: ./gradlew test --no-daemon

      - name: Build RamRPG plugin jar
        run: ./gradlew build --no-daemon
