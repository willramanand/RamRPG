# WP-3.3a: smithing UPGRADE recipes -- raise a placed item's upgrade level for reagents + gold.
#
# THE OUTCOME. Every recipe here is `outcome { type = upgrade_input, upgrade-levels = 1 }`. 3.1a's
# RecipeOutcome.plan collapses that to a single OutcomePlan.Modify that bumps ItemInstanceData.upgradeLevel,
# and the generic 3.1b engine already applies it -- so this file adds CONTENT only, no engine code. The
# item being upgraded is the station's TARGET slot (a `requiresTargetItem` outcome), NOT an ingredient;
# the `inputs` below are the smithing REAGENTS the upgrade consumes.
#
# GATING (same seam as 3.2a). Every tiered reagent is a `type = item` ingredient naming the specific
# ramrpg: id of a refined ingot from content/items/materials.conf -- NOT a `type = material` vanilla name.
# Ingredient.Item matches an RPG ItemKey, so a plain vanilla ingot can never satisfy an upgrade step; only
# the RPG ingot the tier ladder produces can. Higher-tier upgrades also gate on a Combat skill level via
# `requirements` (the WP-2.1a ItemRequirement grammar), exactly like the builtin weapon/armor items.
#
# COST + FAILURE + CAP (pure logic, not content). The static `cost { money }` here is the ENTRY fee for
# the first step at the recipe's representative rarity. The real per-level scaling, the failure chance
# above the safe threshold, and the per-rarity cap all live in
# dev.willram.ramrpg.core.crafting.UpgradeOutcomes (see docs/design/3.3a-upgrade-costs.md): a live
# smithing runtime (a later pipeline WP) consults it around the engine to charge
# UpgradeOutcomes.upgradeGoldCost(current, target, rarity), roll UpgradeOutcomes.isFailure, and refuse a
# step that would cross UpgradeOutcomes.cap(rarity). The XP-level half of the cost reuses
# RarityRules.upgradeXpCost and is quoted as `experience-levels` on each step.
#
# NOTE: `recipes` is not yet a RpgContentLoader KNOWN_TYPES directory (wiring RecipeSpec into the loader
# and registering these at a live smithing station is a later WP). UpgradeCostTest / UpgradeCapTest parse
# this file straight through RecipeSpec to assert the recipes are well-formed, item-id gated and produce
# an upgrade_input outcome.
#
# SHAPE NOTE: same as content/recipes/materials.conf -- ONE HOCON object with per-recipe slugs; only each
# entry's own `id` matters. Namespaced ids are quoted (':' is a HOCON separator).

# ---- Basic reinforcement (safe tier: Tier-2 iron; no skill gate) ----
# Iron ingots reinforce any gear a step. Cheap, ungated, and within the COMMON safe zone.
upgrade_basic {
  id = "ramrpg:upgrade_basic"
  station = "ramrpg:smithing"
  inputs = [
    { type = item, item = "ramrpg:iron_ingot", count = 2 }
  ]
  cost { money = 100.0, experience-levels = 3 }
  outcome { type = upgrade_input, upgrade-levels = 1 }
}

# ---- Reinforced tempering (Tier-3 alloys; Combat gate) ----
# Steel + bronze temper a piece harder; gated like the RARE builtin gear that reaches these levels.
upgrade_reinforced {
  id = "ramrpg:upgrade_reinforced"
  station = "ramrpg:smithing"
  inputs = [
    { type = item, item = "ramrpg:steel_ingot", count = 2 }
    { type = item, item = "ramrpg:bronze_ingot", count = 1 }
  ]
  requirements = [ { type = skill_level, skill = "ramrpg:combat", level = 20 } ]
  cost { money = 300.0, experience-levels = 8 }
  outcome { type = upgrade_input, upgrade-levels = 1 }
}

# ---- Mythic forging (Tier-4 mithril; high Combat gate) ----
# Mithril pushes gear into the high-failure band; the pure UpgradeOutcomes failure model applies here.
upgrade_mythic {
  id = "ramrpg:upgrade_mythic"
  station = "ramrpg:smithing"
  inputs = [
    { type = item, item = "ramrpg:mithril_ingot", count = 2 }
  ]
  requirements = [ { type = skill_level, skill = "ramrpg:combat", level = 45 } ]
  cost { money = 800.0, experience-levels = 15 }
  outcome { type = upgrade_input, upgrade-levels = 1 }
}
