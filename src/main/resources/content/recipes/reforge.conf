# WP-3.3c: reforging as normal crafting RECIPES.
#
# Reforging is no longer a bespoke command/GUI path -- each reforge is a recipe whose outcome is
# `type = reforge`, reusing the EXISTING ReforgeKey ids the builtin reforges already register
# (ramrpg:fierce / sharp / heavy / pure / wise -- see BuiltinReforges.kt). The generic craft engine
# applies the outcome: RecipeOutcome.plan(Reforge) collapses to OutcomePlan.Modify, which stamps
# ItemInstanceData.reforge; ReforgeStatProvider then reads that field UNCHANGED and produces the same
# stats it always has. There is no reforge-specific stat path -- that is the whole point.
#
# THE POOL IS DATA. This set of reforge recipes IS the reforge pool: which reforges a player can choose
# at a station. Adding/removing a reforge option is an edit here, not a code change. A future
# "random reforge" recipe/runtime can pick one deterministically from the pool via
# ReforgeOutcomes.selectReforge (seeded) -- no api change needed.
#
# TARGET vs REAGENTS. A reforge is a `requiresTargetItem` outcome: the item being reforged is supplied
# in the station's TARGET slot (never an `inputs` ingredient), so `inputs` here lists only the reagent
# catalyst. The AMETHYST_SHARD catalyst is a plain vanilla `type = material` cost, not a tier gate.
#
# COST. The static `cost` below is a fixed baseline (a recipe cannot know the target item's rarity). A
# runtime that scales the charge to the TARGET item's rarity uses ReforgeOutcomes.reforgeCost(rarity),
# which reuses the existing RarityRules.reforgeXpCost ladder. See docs/design/3.3c-reforge-costs.md.
#
# NOTE: `recipes` is not yet a RpgContentLoader.KNOWN_TYPES directory (wiring RecipeSpec into the loader
# + registering these at a live station is a later pipeline WP). ReforgeAsRecipeTest parses this file
# straight through RecipeSpec to assert each entry is a well-formed Reforge outcome over a real reforge.
#
# SHAPE NOTE: same as materials.conf -- a single HOCON object with per-recipe slugs; ids are quoted
# because ':' is a HOCON separator.

reforge_fierce {
  id = "ramrpg:reforge_fierce"
  station = "ramrpg:smithing"
  inputs = [
    { type = material, materials = ["AMETHYST_SHARD"], count = 1 }
  ]
  cost { money = 250.0, experience-levels = 10 }
  outcome { type = reforge, reforge = "ramrpg:fierce" }
}

