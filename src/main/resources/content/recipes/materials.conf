# WP-3.2a: material refining recipes that chain tier N -> tier N+1.
#
# GATING (the crux): every TIERED input is a `type = item` ingredient naming the specific ramrpg: id of
# the lower tier -- NOT a `type = material` vanilla name. Ingredient.Item matches an RPG ItemKey, whereas
# Ingredient.MaterialTag (what `type = material` resolves to) matches a RAW vanilla Material. So a plain
# vanilla Copper/Iron ingot, Netherite Scrap or Diamond can NEVER satisfy a refine step: only the RPG
# item produced by the previous tier's recipe can. Catalysts (fuels/reagents that are meant to come from
# vanilla sources) stay `type = material`, since they are not the tier gate.
#
# See docs/design/3.2a-material-tiers.md for the ladder, the cost/XP model, and the tag-seam note.
#
# STATION (WP-3.1e): every refine here is a `new_item` outcome, so it belongs to the CRAFTING BENCH
# (`ramrpg:crafting_bench`, which permits NEW_ITEM/TRANSMUTE), NOT the smithing table (which permits only
# the item-TRANSFORMING kinds and would reject these with DISALLOWED_OUTCOME). See the 3.1a station model
# and docs/design/3.1e-crafting-runtime.md.
#
# NOTE: MaterialTierChainTest parses this file straight through RecipeSpec to assert the chain is
# well-formed and item-id gated; CraftingContentPipelineTest loads the whole shipped pack end-to-end.
#
# SHAPE NOTE: same as builtin.conf -- a single HOCON object with per-recipe slugs.

# ---- Tier 1 -> Tier 2: ore smelting (tiered input = the ramrpg: ore item; catalyst = vanilla fuel) ----

refine_copper_ore {
  id = "ramrpg:refine_copper_ore"
  station = "ramrpg:crafting_bench"
  inputs = [
    { type = item, item = "ramrpg:copper_ore", count = 2 }
    { type = material, materials = ["COAL", "CHARCOAL"], count = 1 }
  ]
  cost { money = 50.0 }
  outcome { type = new_item, item = "ramrpg:copper_ingot", count = 1 }
}

refine_iron_ore {
  id = "ramrpg:refine_iron_ore"
  station = "ramrpg:crafting_bench"
  inputs = [
    { type = item, item = "ramrpg:iron_ore", count = 2 }
    { type = material, materials = ["COAL", "CHARCOAL"], count = 1 }
  ]
  cost { money = 50.0 }
  outcome { type = new_item, item = "ramrpg:iron_ingot", count = 1 }
}

refine_tin_ore {
  id = "ramrpg:refine_tin_ore"
  station = "ramrpg:crafting_bench"
  inputs = [
    { type = item, item = "ramrpg:tin_ore", count = 2 }
    { type = material, materials = ["COAL", "CHARCOAL"], count = 1 }
  ]
  cost { money = 50.0 }
  outcome { type = new_item, item = "ramrpg:tin_ingot", count = 1 }
}

# ---- Tier 2 -> Tier 3: alloying (every tiered input is a specific tier-2 ramrpg: ingot) ----

# Bronze = copper + tin. Two item-gated tier-2 inputs; no vanilla ingot can stand in for either.
refine_bronze {
  id = "ramrpg:refine_bronze"
  station = "ramrpg:crafting_bench"
  inputs = [
    { type = item, item = "ramrpg:copper_ingot", count = 3 }
    { type = item, item = "ramrpg:tin_ingot", count = 1 }
  ]
  cost { money = 150.0 }
  outcome { type = new_item, item = "ramrpg:bronze_ingot", count = 1 }
}

# Steel = iron carburised with charcoal. Tiered input is the ramrpg: iron ingot; charcoal is the catalyst.
refine_steel {
  id = "ramrpg:refine_steel"
  station = "ramrpg:crafting_bench"
  inputs = [
    { type = item, item = "ramrpg:iron_ingot", count = 3 }
    { type = material, materials = ["COAL", "CHARCOAL"], count = 2 }
  ]
  cost { money = 150.0 }
  outcome { type = new_item, item = "ramrpg:steel_ingot", count = 1 }
}

# ---- Tier 3 -> Tier 4: mythic forging (tiered inputs are the tier-3 alloys) ----
# Catalyst ECHO_SHARD is obtainable from Ancient City loot chests (replaces the rejected commit's
# invalid DEEP_DARK_BLOCK and the survival-unobtainable BEDROCK).
refine_mithril {
  id = "ramrpg:refine_mithril"
  station = "ramrpg:crafting_bench"
  inputs = [
    { type = item, item = "ramrpg:steel_ingot", count = 2 }
    { type = item, item = "ramrpg:bronze_ingot", count = 1 }
    { type = material, materials = ["ECHO_SHARD"], count = 1 }
  ]
  cost { money = 300.0 }
  outcome { type = new_item, item = "ramrpg:mithril_ingot", count = 1 }
}
