# ---- Remove the gem from socket 0 (no reagent; the gem is destroyed) ----

remove_gem {
  id = "ramrpg:remove_gem"
  station = "ramrpg:smithing"
  inputs = []
  cost { money = 750.0 }
  outcome { type = remove_gem, index = 0 }
}
