# WP-3.3d: socket cutting and gem recipes.
#
# The three socket operations are ordinary recipes on the smithing station (which permits INSERT_GEM /
# ADD_SOCKET / REMOVE_GEM -- see 3.1a): cut a new empty slot (add_socket), insert a gem into an existing
# slot (insert_gem), and remove a gem (remove_gem). The generic craft engine already APPLIES the
# OutcomePlan.Modify each outcome collapses to; this file only supplies the CONTENT + costs.
#
# INPUT CONVENTION: all three outcomes are `requiresTargetItem` (3.1a), so at craft time inputs[0] is the
# player's TARGET item and the recipe's `inputs` below are the REAGENTS matched against inputs.drop(1)
# (see CraftingServiceImpl.contextFor). The target is transformed, never consumed.
#
# SLOT CAP: the per-item cap is NOT expressed in this grammar -- RecipeOutcome.plan only appends sockets.
# SocketOutcomes.validateAddSocket(target.sockets, count, RarityRules.socketCap(rarity)) is the gate the
# runtime applies before a cut, so a COMMON item stops at 1 socket and a MYTHIC at 6. See
# docs/design/3.3d-socket-costs.md.
#
# COSTS mirror dev.willram.ramrpg.core.crafting.SocketOutcomes exactly (SocketCutMaxSlotsTest /
# GemInsertRemoveTest assert this): cut = addSocketCost(0) = 500 money + 3 XP levels; insert =
# insertGemCost() = 250 money; remove = removeGemCost() = 750 money.
#
# GEMS: every insert_gem reuses an existing builtin GemKey id (BuiltinGems: ruby, sapphire, emerald,
# amethyst, topaz, opal) and consumes the vanilla gem it is cut from as its reagent. The gem's stats keep
# flowing through the unchanged SocketStatProvider once set.
#
# NOTE: `recipes` is not yet a RpgContentLoader.KNOWN_TYPES directory (wiring RecipeSpec into the loader
# and registering these at a live station is a later pipeline WP). The WP-3.3d tests parse this file
# straight through RecipeSpec, like MaterialTierChainTest does for materials.conf.
#
# SHAPE NOTE: a single HOCON object with per-recipe slugs (same as materials.conf); ids are quoted.

# ---- Cut a new socket slot (respects the per-item rarity cap, enforced by SocketOutcomes) ----

cut_socket {
  id = "ramrpg:cut_socket"
  station = "ramrpg:smithing"
  inputs = [
    { type = material, materials = ["DIAMOND"], count = 1 }
  ]
  requirements = [ { type = skill_level, skill = "ramrpg:mining", level = 15 } ]
  cost { money = 500.0, experience-levels = 3 }
  outcome { type = add_socket, socket-type = "ramrpg:generic", count = 1 }
}

# ---- Insert a gem into socket 0 (one recipe per builtin GemKey; reagent = the vanilla gem) ----

socket_ruby {
  id = "ramrpg:socket_ruby"
  station = "ramrpg:smithing"
  inputs = [
    { type = material, materials = ["REDSTONE"], count = 1 }
  ]
  cost { money = 250.0 }
  outcome { type = insert_gem, gem = "ramrpg:ruby", index = 0 }
}

socket_sapphire {
  id = "ramrpg:socket_sapphire"
  station = "ramrpg:smithing"
  inputs = [
    { type = material, materials = ["LAPIS_LAZULI"], count = 1 }
  ]
  cost { money = 250.0 }
  outcome { type = insert_gem, gem = "ramrpg:sapphire", index = 0 }
