    "2" { effects = [
      { type = stat, stat = "ramrpg:speed", amount = 10.0 }
    ] }
    "4" { effects = [
      { type = stat, stat = "ramrpg:attack_speed", amount = 5.0 }
      { type = stat, stat = "ramrpg:speed", amount = 10.0 }
    ] }
  }
}
