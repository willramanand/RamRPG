# WP-5.3: shipped armor sets -- one per material tier, each built around a theme (crit/tank/caster/
# ranged) and granting ordinary `stat` Effect bonuses at 2- and 4-piece thresholds. See
# docs/design/5.3-armor-sets.md for the full threshold model and why thresholds STACK (the 4-piece
# bonus does not replace the 2-piece bonus -- both are active at 4/4).
#
# SHAPE NOTE: same as content/items/builtin.conf -- RamCore's HOCON loader parses a `.conf` file's root
# as one OBJECT, so this is a single object whose top-level keys are per-set slugs (arbitrary -- only
# each entry's own `id` matters); RpgContentLoader.extractPackagedContent splits it into one real,
# independently valid `<slug>.conf` file per key before RamCore's ContentLoader ever sees it. Members
# reference item ids from content/items/builtin.conf (WP-1.5d).

netherite_berserker {
  id = "ramrpg:netherite_berserker"
  name = "<dark_red>Netherite Berserker"
  members = [
    "ramrpg:netherite_helmet"
    "ramrpg:netherite_chestplate"
    "ramrpg:netherite_leggings"
    "ramrpg:netherite_boots"
  ]
  thresholds {
    "2" { effects = [
      { type = stat, stat = "ramrpg:crit_chance", amount = 8.0 }
    ] }
    "4" { effects = [
      { type = stat, stat = "ramrpg:crit_damage", amount = 25.0 }
      { type = stat, stat = "ramrpg:ferocity", amount = 5.0 }
    ] }
  }
}

