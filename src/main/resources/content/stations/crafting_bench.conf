# WP-3.1e: the crafting bench -- the vanilla Crafting Table, re-skinned as the RPG crafting/transmute bench.
#
# A station is a vanilla block (`blocks`) that, right-clicked, opens a RamCore menu (`rows` + `name`)
# restricted to recipes whose outcome kind is in `permitted-kinds` (see docs/design/3.1a-crafting-model.md).
# WP-3.1d's registrar resolves `blocks` -> a BlockMatcher (via BlockMatchers.ofMaterials) and `rows`+`name`
# -> a RamCore MenuView (via Menus.menu), then registers the Station into the StationRegistry owner-scoped.
#
# PERMITTED KINDS. The 3.1a model gives the crafting/transmute bench the item-CREATING outcomes:
# `{NEW_ITEM, TRANSMUTE}`. Smithing owns the item-TRANSFORMING outcomes (upgrade/repair/reforge/socket) and
# deliberately does NOT permit NEW_ITEM -- so the material-refine recipes in content/recipes/materials.conf
# (all `new_item`) are craftable HERE, not at the smithing table (where they would be DISALLOWED_OUTCOME).
# See docs/design/3.1e-crafting-runtime.md.
#
# SHAPE NOTE: same as content/stations/smithing.conf -- ONE HOCON object whose top-level key is the entry
# slug; only the child's own `id` matters. Namespaced ids are quoted (':' is a HOCON separator).
# extractPackagedContent splits this into content/stations/crafting_bench.conf on first run.

crafting_bench {
  id = "ramrpg:crafting_bench"
  name = "<gold>Crafting Bench"
  blocks = ["CRAFTING_TABLE"]
  rows = 5
  permitted-kinds = ["NEW_ITEM", "TRANSMUTE"]
}
