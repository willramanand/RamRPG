# WP-3.1d: the smithing station -- the vanilla Smithing Table, re-skinned as the RPG smithing bench.
#
# A station is a vanilla block (`blocks`) that, right-clicked, opens a RamCore menu (`rows` + `name`)
# restricted to recipes whose outcome kind is in `permitted-kinds` (see docs/design/3.1a-crafting-model.md).
# WP-3.1d's registrar resolves `blocks` -> a BlockMatcher (via BlockMatchers.ofMaterials) and `rows`+`name`
# -> a RamCore MenuView (via Menus.menu), then registers the Station into the StationRegistry owner-scoped;
# StationBlockListener (WP-3.1b) then opens it on a right-click of the matched block.
#
# PERMITTED KINDS. Smithing owns the item-TRANSFORMING outcomes: upgrade, repair, reforge, and the three
# socket arms (insert/add/remove). The shipped recipe packs target this station:
#   - content/recipes/smithing_upgrade.conf (upgrade_input)
#   - content/recipes/reforge.conf          (reforge)
#   - content/recipes/sockets.conf          (add_socket / insert_gem / remove_gem)
# (content/recipes/materials.conf ships `new_item` refine recipes that also name this station; NEW_ITEM is
#  a crafting/transmute-bench kind in the 3.1a model, so those load but are not craftable here until a
#  crafting bench ships or the pack moves -- a runtime/content follow-up, tracked in the WP report.)
#
# SHAPE NOTE: same as content/items/builtin.conf / content/recipes/*.conf -- ONE HOCON object whose
# top-level key is the entry slug; only the child's own `id` matters. Namespaced ids are quoted (':' is a
# HOCON separator). extractPackagedContent splits this into content/stations/smithing.conf on first run.

smithing {
  id = "ramrpg:smithing"
  name = "<gold>Smithing Table"
  blocks = ["SMITHING_TABLE"]
  rows = 5
  permitted-kinds = ["UPGRADE_INPUT", "REPAIR", "REFORGE", "INSERT_GEM", "ADD_SOCKET", "REMOVE_GEM"]
}
