# WP-6.2: the shipped level bands. Loaded directly by LevelBandService.fromPackagedResource -- NOT
# through RpgContentLoader/ContentModule's content/<type>/ pipeline (see docs/design/6.2-level-bands.md
# for why: this is a fixed 5-entry dataset, not per-entry operator-authorable content yet). Same
# one-HOCON-object-of-slugs shape as content/items/builtin.conf (a bare top-level array is rejected by
# Configurate's HOCON loader -- see that file's own header comment) -- only each entry's own `id` field
# matters; the slug keys below (band_1..band_5) are arbitrary.
#
# Each entry's `region` block is a real RegionSpec (dev.willram.ramcore.content.spec.RegionSpec) --
# `priority`, `shape.type` (cuboid|sphere), and the shape's own fields -- turned into a real RuleRegion
# by ContentRegistrar.toRuleRegion. The five regions are concentric spheres centred on (0,0,0) in the
# default "world", with radius = minLevel-band-index * 1000 blocks (LevelBandService.RING_WIDTH) and
# priority inverted (the smallest/innermost sphere wins ties, since RegionRuleEngine.regionsAt returns
# every containing region and LevelBandService picks the first one it recognises, highest priority
# first). This makes the shipped regions agree with the distance-from-spawn fallback curve by
# construction: a point with no region-name match (a different world, or beyond band_5's radius) still
# lands on the same band via distance alone. See docs/design/6.2-level-bands.md for the full multiplier
# ladder and tier-weight rationale (both are placeholders pending the WP-7.4 tuning pass, per
# docs/design/0.1-power-curve.md).

band_1 {
  id = "ramrpg:band_1"
  min-level = 1
  max-level = 10
  stat-multiplier = 1.0
  tier-weights {}
  region {
    priority = 5
    shape { type = "sphere", center { x = 0.0, y = 64.0, z = 0.0, world = "world" }, radius = 1000.0 }
  }
}

band_2 {
  id = "ramrpg:band_2"
  min-level = 11
  max-level = 25
  stat-multiplier = 3.0
  tier-weights { uncommon = 0.15 }
  region {
    priority = 4
    shape { type = "sphere", center { x = 0.0, y = 64.0, z = 0.0, world = "world" }, radius = 2000.0 }
  }
}

band_3 {
  id = "ramrpg:band_3"
  min-level = 26
  max-level = 45
  stat-multiplier = 10.0
  tier-weights { uncommon = 0.25, rare = 0.08 }
  region {
    priority = 3
    shape { type = "sphere", center { x = 0.0, y = 64.0, z = 0.0, world = "world" }, radius = 3000.0 }
  }
}

band_4 {
  id = "ramrpg:band_4"
  min-level = 46
  max-level = 70
  stat-multiplier = 35.0
  tier-weights { uncommon = 0.30, rare = 0.15, epic = 0.05 }
  region {
    priority = 2
    shape { type = "sphere", center { x = 0.0, y = 64.0, z = 0.0, world = "world" }, radius = 4000.0 }
  }
}

band_5 {
  id = "ramrpg:band_5"
  min-level = 71
  max-level = 100
  stat-multiplier = 120.0
  tier-weights { uncommon = 0.30, rare = 0.20, epic = 0.10, legendary = 0.03 }
  region {
    # Effectively unbounded -- the outermost band covers everything past band_4's ring that the
    # distance fallback would also assign to band_5 (see LevelBandService.RING_WIDTH / fallback).
    priority = 1
    shape { type = "sphere", center { x = 0.0, y = 64.0, z = 0.0, world = "world" }, radius = 1000000.0 }
  }
}
