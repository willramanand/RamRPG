# WP-3.2a: the material tier ladder as pure content -- raw ores and refined ingots organised into a
# 4-tier progression. Each item carries a `tags` set whose first entry is its `tier-N` band; the tag
# scheme is documented in docs/design/3.2a-material-tiers.md.
#
# The refining recipes in content/recipes/materials.conf chain these items tier N -> tier N+1, and they
# GATE every tier-to-tier step on the specific ramrpg: item id of the lower tier (a `type = item`
# ingredient), NOT on a raw vanilla Material -- so a plain vanilla ingot can never satisfy a refine step.
# `tags` is a forward-looking, PARSED-BUT-NOT-YET-MATCHED field (see ItemSpec.tags' KDoc and the design
# doc): no Ingredient consumes it today; wiring an Ingredient.Tag kind that does is a later WP.
#
# SHAPE NOTE: same as content/items/builtin.conf -- ONE HOCON object whose top-level keys are per-item
# slugs (arbitrary; only each entry's own `id` matters). A future WP that packages this file will list it
# in RpgContentLoader.PACKAGED_CONTENT so extractPackagedContent splits it into one real .conf per key,
# exactly as it already does for builtin.conf; that wiring is out of THIS WP's scope.
#
# Rarity tracks the item-level band anchors from docs/design/2.1a-item-level-requirements.md
# (COMMON=1, UNCOMMON=11, RARE=26, LEGENDARY=60) so each tier's rarity and item-level agree.

# ---- Tier 1 (raw ores; obtained from mining -- block-drop wiring is a later WP) ----
copper_ore {
  id = "ramrpg:copper_ore"
  name = "Copper Ore"
  material = "DEEPSLATE_COPPER_ORE"
  rarity = "COMMON"
  categories = ["MISC"]
  item-level = 1
  tags = ["tier-1", "ore", "metal"]
}

iron_ore {
  id = "ramrpg:iron_ore"
  name = "Iron Ore"
  material = "DEEPSLATE_IRON_ORE"
  rarity = "COMMON"
  categories = ["MISC"]
  item-level = 1
  tags = ["tier-1", "ore", "metal"]
}

tin_ore {
  id = "ramrpg:tin_ore"
  name = "Tin Ore"
  material = "RAW_COPPER"
  rarity = "COMMON"
  categories = ["MISC"]
  item-level = 1
  tags = ["tier-1", "ore", "metal"]
}

# ---- Tier 2 (base ingots; refined 1:1 from the matching tier-1 ore) ----
copper_ingot {
  id = "ramrpg:copper_ingot"
  name = "Copper Ingot"
  material = "COPPER_INGOT"
  rarity = "UNCOMMON"
  categories = ["MISC"]
  item-level = 11
  tags = ["tier-2", "ingot", "metal"]
}

iron_ingot {
  id = "ramrpg:iron_ingot"
  name = "Iron Ingot"
  material = "IRON_INGOT"
  rarity = "UNCOMMON"
  categories = ["MISC"]
  item-level = 11
  tags = ["tier-2", "ingot", "metal"]
}

tin_ingot {
  id = "ramrpg:tin_ingot"
  name = "Tin Ingot"
  material = "BRICK"
  rarity = "UNCOMMON"
  categories = ["MISC"]
  item-level = 11
  tags = ["tier-2", "ingot", "metal"]
}

# ---- Tier 3 (alloys; smelted from tier-2 ingots) ----
bronze_ingot {
  id = "ramrpg:bronze_ingot"
  name = "Bronze Ingot"
  material = "GOLD_INGOT"
  rarity = "RARE"
  categories = ["MISC"]
  item-level = 26
  tags = ["tier-3", "ingot", "metal"]
}

steel_ingot {
  id = "ramrpg:steel_ingot"
  name = "Steel Ingot"
  material = "NETHERITE_SCRAP"
  rarity = "RARE"
  categories = ["MISC"]
  item-level = 26
  tags = ["tier-3", "ingot", "metal"]
}

# ---- Tier 4 (mythic; forged from tier-3 alloys) ----
mithril_ingot {
  id = "ramrpg:mithril_ingot"
  name = "Mithril Ingot"
  material = "DIAMOND"
  rarity = "LEGENDARY"
  categories = ["MISC"]
  item-level = 60
  tags = ["tier-4", "ingot", "metal", "precious"]
}
