# WP-1.5d: the RamRPG builtin item catalogue, expressed as content instead of hand-written Kotlin.
# This is the SAME set of items dev.willram.ramrpg.builtin.items.BuiltinItems used to construct in
# memory (see docs/design/1.5d-builtin-content.md for the parity guarantee and BuiltinItemsParityTest,
# which asserts this file + the loader produce field-for-field the same ItemDefinitions the old Kotlin
# tables did). Packaged inside the plugin jar under content/items/builtin.conf; ContentRegistrarRpg
# resolves `material` (a raw string here -- specs stay Bukkit-free) and copies effects/item-level/
# requirements/equip-slots onto the built ItemDefinition.
#
# SHAPE NOTE: RamCore's HOCON loader (org.spongepowered.configurate's HoconConfigurationLoader, backed
# by typesafe-config) parses a `.conf` file's `Config` root as an OBJECT -- a bare top-level ARRAY is
# rejected ("has type LIST rather than object at file root"), even though YAML content files (and this
# codebase's own docs/design/1.5a-content-schema.md) describe "a top-level list of entries" as if it
# applied uniformly to every content file extension. It does not for `.conf`: only YAML's loader accepts
# a root sequence. So this file is ONE HOCON object whose top-level keys are per-item slugs (arbitrary --
# only each entry's own `id` field matters to the loader); RpgContentLoader.extractPackagedContent
# splits it into one real, independently valid `<slug>.conf` file per key before RamCore's ContentLoader
# ever sees it (both for the first-run copy into an operator's data folder, and for the in-memory
# "parity path" BuiltinItems/BuiltinItemsParityTest use) -- see docs/design/1.5d-builtin-content.md.
# This keeps exactly one packaged source file while still handing RamCore's loader the single-entry
# shape it actually supports; no HOCON/YAML parsing is reimplemented, only Configurate's own
# load-a-child-node / save-a-node API.
#
# itemLevel bands and the Combat-level gate this table encodes are documented in
# docs/design/2.1a-item-level-requirements.md (band anchors: COMMON=1, UNCOMMON=11, RARE=26,
# LEGENDARY=60, MYTHIC=85; Combat gate: UNCOMMON=10, RARE=20, LEGENDARY=45, MYTHIC=60, halved for armor).

