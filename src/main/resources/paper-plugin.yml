name: RamRPG
version: '${project.version}'
main: dev.willram.ramrpg.RamRPG
api-version: '1.21'
folia-supported: true
dependencies:
  server:
    # Add a required "RequiredPlugin" dependency, which will load AFTER your plugin.
    RamCore:
      load: BEFORE
      required: true
      # This means that your plugin will not have access to their classpath
      join-classpath: true
    # Add a required "RequiredPlugin" dependency, which will load AFTER your plugin.
    ProtocolLib:
      load: BEFORE
      required: true
      # This means that your plugin will not have access to their classpath
      join-classpath: true
    Vault:
      load: BEFORE
      required: false
      # This means that your plugin will not have access to their classpath
      join-classpath: true
    MythicMobs:
      load: BEFORE
      required: false
      # This means that your plugin will not have access to their classpath
      join-classpath: true
permissions:
  ramrpg.admin:
    description: Allows use of RamRPG admin skill commands (/skills reload, reset, give).
    default: op
  ramrpg.command.admin:
    description: Umbrella permission granting all RamRPG /rpg admin commands.
    default: op
    children:
      ramrpg.command.reload: true
      ramrpg.command.validate: true
  ramrpg.command.reload:
    description: Allows use of /rpg reload to rebuild content registries.
    default: op
  ramrpg.command.validate:
    description: Allows use of /rpg validate to check content for errors.
    default: op